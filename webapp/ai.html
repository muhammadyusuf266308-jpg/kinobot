<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Yordamchi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #1a1a2e);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            max-width: 85%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            line-height: 1.4;
        }
        .msg-user {
            background-color: var(--tg-theme-button-color, #0078ff);
            color: var(--tg-theme-button-text-color, #ffffff);
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }
        .msg-ai {
            background-color: var(--tg-theme-secondary-bg-color, #2a2a35);
            color: var(--tg-theme-text-color, #ffffff);
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
        }
        .input-area {
            background-color: var(--tg-theme-secondary-bg-color, #2a2a35);
            padding: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        input {
            flex: 1;
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 2rem;
            outline: none;
        }
        button {
            background-color: var(--tg-theme-button-color, #0078ff);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="p-4 text-center border-b border-gray-700 bg-opacity-90 backdrop-blur">
        <h1 class="font-bold text-lg"><i class="fas fa-robot text-blue-400 mr-2"></i> UzKino AI</h1>
        <p class="text-xs text-gray-400">Har qanday kinoni syujeti orqali topaman!</p>
    </header>

    <div class="chat-container" id="chatBox">
        <div class="message msg-ai">
            Assalomu alaykum! Menga kino syujetini, qahramonlarini yozing yoki istalgan savolingizni bering. Sizga darhol javob beraman! 😊
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Xabar yozing..." autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        function appendMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'msg-user' : 'msg-ai'}`;
            div.innerHTML = text.replace(/\n/g, '<br>');
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, true);
            userInput.value = '';
            
            // Loading indicator
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message msg-ai text-gray-400';
            loadingDiv.id = loadingId;
            loadingDiv.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> O\'ylanmoqda...';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/api/ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: text })
                });
                const data = await res.json();
                document.getElementById(loadingId).remove();
                
                // Ai qaytargan xabardagi telegram taglarini tozalash
                let answer = data.answer || "Kechirasiz, xatolik yuz berdi.";
                answer = answer.replace(/<b>(.*?)<\/b>/g, '<strong>$1</strong>');
                answer = answer.replace(/<i>(.*?)<\/i>/g, '<em>$1</em>');
                
                appendMessage(answer, false);
            } catch (err) {
                document.getElementById(loadingId).remove();
                appendMessage("Xatolik yuz berdi. Iltimos, qayta urinib ko'ring.", false);
            }
        }
    </script>
</body>
</html>
