<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kino Katalogi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #141414);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .movie-card {
            background-color: var(--tg-theme-secondary-bg-color, #2a2a2a);
            transition: transform 0.2s;
        }
        .movie-card:active {
            transform: scale(0.96);
        }
        .poster-placeholder {
            background: linear-gradient(135deg, #e50914 0%, #8b0000 100%);
        }
    </style>
</head>
<body class="antialiased pb-20">
    <header class="sticky top-0 z-50 bg-opacity-90 backdrop-blur-md bg-[#141414] p-4 border-b border-gray-800">
        <h1 class="text-2xl font-bold text-red-600 tracking-wider text-center mb-3">KINO KATALOGI</h1>
        <div class="relative">
            <input type="text" id="searchInput" placeholder="Kino qidiring..." 
                   class="w-full bg-gray-800 text-white rounded-full py-2 px-4 pl-10 focus:outline-none focus:ring-2 focus:ring-red-600">
            <i class="fas fa-search absolute left-3 top-3.5 text-gray-400"></i>
        </div>
    </header>

    <div class="flex overflow-x-auto space-x-2 p-4 scrollbar-hide" id="genreFilters">
        <!-- Genres injected via JS -->
    </div>

    <div class="grid grid-cols-2 gap-4 p-4" id="moviesGrid">
        <p class="col-span-2 text-center text-gray-400 py-10" id="loadingMsg">Kinolar yuklanmoqda...</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let allMovies = [];
        let currentGenre = 'Barchasi';

        const grid = document.getElementById('moviesGrid');
        const searchInput = document.getElementById('searchInput');
        const filtersDiv = document.getElementById('genreFilters');
        const loadingMsg = document.getElementById('loadingMsg');

        async function fetchMovies() {
            try {
                const res = await fetch('/api/movies');
                allMovies = await res.json();
                loadingMsg.style.display = 'none';
                renderFilters();
                renderMovies(allMovies);
            } catch (err) {
                loadingMsg.innerText = "Xatolik yuz berdi :(";
            }
        }

        function renderFilters() {
            const genres = ['Barchasi', ...new Set(allMovies.map(m => m.genre).filter(Boolean))];
            filtersDiv.innerHTML = '';
            genres.forEach(g => {
                const btn = document.createElement('button');
                btn.innerText = g;
                btn.className = `px-4 py-1 rounded-full text-sm font-semibold whitespace-nowrap ${currentGenre === g ? 'bg-red-600 text-white' : 'bg-gray-800 text-gray-300'}`;
                btn.onclick = () => { currentGenre = g; renderFilters(); filterMovies(); };
                filtersDiv.appendChild(btn);
            });
        }

        function filterMovies() {
            const q = searchInput.value.toLowerCase();
            let filtered = allMovies.filter(m => (m.title || '').toLowerCase().includes(q));
            if (currentGenre !== 'Barchasi') {
                filtered = filtered.filter(m => m.genre === currentGenre);
            }
            renderMovies(filtered);
        }

        function renderMovies(movies) {
            grid.innerHTML = '';
            if (movies.length === 0) {
                grid.innerHTML = '<p class="col-span-2 text-center text-gray-400">Hech narsa topilmadi</p>';
                return;
            }
            movies.forEach(m => {
                const card = document.createElement('div');
                card.className = 'movie-card rounded-xl overflow-hidden shadow-lg flex flex-col cursor-pointer';
                card.onclick = () => {
                    // Send data to Bot
                    const code = m.bot_code.replace(/[^0-9]/g, '');
                    tg.sendData(code);
                    tg.close();
                };
                
                card.innerHTML = `
                    <div class="poster-placeholder w-full h-40 flex items-center justify-center">
                        <i class="fas fa-play-circle text-4xl text-white opacity-60"></i>
                    </div>
                    <div class="p-3">
                        <h3 class="font-bold text-sm truncate">${m.title}</h3>
                        <div class="flex justify-between items-center mt-2 text-xs text-gray-400">
                            <span>${m.year || ''}</span>
                            <span class="bg-gray-700 px-2 py-1 rounded truncate max-w-[50%]">${m.genre || 'Kino'}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', filterMovies);
        fetchMovies();
    </script>
</body>
</html>
